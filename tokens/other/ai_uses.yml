- id: brainstorming
  name: Brainstorming
  patterns:
    - brainstorm [p]
  description: "Using AI to generate ideas, explore options, or think through approaches."
  parentId: ai_applications

- id: code_assistance
  name: Code Assistance
  patterns:
    - code, assist [l]
    - code, assistance [l]
    - code, suggestion [l]
  description: "Using AI for general help with writing, editing, or understanding code."
  parentId: ai_applications

- id: code_completion
  name: Code Completion
  patterns:
    - code, completion [l]
  description: Using AI to autocomplete code or suggest snippets while programming.
  parentId: code_assistance

- id: code_explanation
  name: Code Explanation
  description: "Using AI to explain unfamiliar code, APIs, errors, or programming concepts."
  parentId: code_assistance
  patterns:
    - code, explanation [l]

- id: code_documentation
  name: Code Documentation
  description: >-
    Using AI to write or improve comments, API docs, READMEs, or other
    code-related documentation.
  parentId: code_assistance
  patterns:
    - code, documentation [l]

- id: code_debugging
  name: Code Debugging
  patterns:
    - debugging
  description: "Using AI to find, explain, or fix bugs and errors in code."
  parentId: code_assistance

- id: image_generation_processing
  name: Image Generation
  description: "Using AI to create, edit, analyze, or transform images."
  parentId: ai_applications
  patterns:
    - image
    - vision
    - visual

- id: sound_music_generation
  name: Sound & Music
  description: "Using AI to create, edit, transform, or analyze audio, sound, or music."
  parentId: ai_applications
  patterns:
    - music
    - song
    - sound

- id: code_assistance

- id: search_information_gathering
  name: Information Gathering
  description: >-
    Using AI to find information, research topics, compare options, or gather
    references.
  parentId: ai_applications

- id: not_using
  name: Not Using
  description: Responses indicating the respondent does not use AI tools for this purpose.
  parentId: ai_adoption_stance

- id: data_manipulation_processing
  name: Data Processing
  description: "Using AI to clean, transform, summarize, classify, or analyze data."
  parentId: ai_applications
  patterns:
    - data

- id: text_processing
  name: Text Processing
  description: >-
    Using AI to write, rewrite, summarize, translate, classify, or otherwise
    process text.
  parentId: ai_applications
  patterns:
    - text
    - spell( )?check
    - proof( )?reading
    - editing

- id: project_planning
  description: >-
    Using AI to plan projects, break down tasks, estimate work, or organize
    implementation steps.
  parentId: ai_applications
  patterns:
    - planning

- id: generating_documentation
  name: Generating Documentation
  description: >-
    Using AI to produce documentation, guides, explanations, or written
    reference material.
  parentId: code_assistance
  patterns:
    - documentation

- id: ai_search
  name: AI Search
  patterns:
    - search
  description: Using AI tools as a search engine or question-answering interface.
  parentId: search_information_gathering

- id: video_generation
  name: Video Generation
  description: "Using AI to create, edit, transform, or analyze video."
  parentId: ai_applications
  patterns:
    - video

- id: workflow_automation
  name: Workflow Automation
  description: >-
    Using AI to automate repetitive tasks, connect tools, or streamline
    development workflows.
  parentId: ai_applications
  patterns:
    - automation

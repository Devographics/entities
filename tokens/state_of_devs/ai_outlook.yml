# ------------------------------------------------------------------- #
#    Neutral Sentiment
# ------------------------------------------------------------------- #

- id: neutral_ai_sentiment
  name: Neutral sentiment

- id: inevitability
  name: Inevitability
  description:
    Viewing widespread AI adoption as inevitable regardless of one's own
    preference.
  parentId: neutral_ai_sentiment

- id: tool_framing
  name: AI as Just a Tool
  description:
    Framing AI as a neutral tool whose value depends entirely on how it
    is used.
  parentId: neutral_ai_sentiment

- id: still_learning_navigating
  name: Still Figuring It Out
  description:
    Undecided or still forming a view, actively navigating what AI means
    for them.
  parentId: neutral_ai_sentiment

- id: not_using_ai
  name: Not Using
  description: Responses indicating the respondent does not use AI tools for this purpose.
  parentId: neutral_ai_sentiment

- id: agentic_workflows
  name: Agentic Workflows & Tooling
  description: Comments on AI agents and their integration into development workflows.
  parentId: neutral_ai_sentiment

- id: skill_dependent_outcomes
  name: Skill-Dependent Outcomes
  description: AI's usefulness depending heavily on the user's own expertise.
  parentId: neutral_ai_sentiment

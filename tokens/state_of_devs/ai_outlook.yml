# ------------------------------------------------------------------- #
#    AI ADOPTION STANCE
#    Overall stances toward adopting or rejecting AI.
# ------------------------------------------------------------------- #

- id: ai_adoption_stance
  name: AI Adoption Stance
  description: Overall stances toward adopting or rejecting AI.

- id: inevitability
  name: Inevitability
  description:
    Viewing widespread AI adoption as inevitable regardless of one's own
    preference.
  parentId: ai_adoption_stance

- id: tool_framing
  name: AI as Just a Tool
  description:
    Framing AI as a neutral tool whose value depends entirely on how it
    is used.
  parentId: ai_adoption_stance

- id: wish_it_didnt_exist
  name: Rejection / Wish It Didn't Exist
  description: Outright rejection of AI or wishing it had never been developed.
  parentId: ai_adoption_stance

- id: still_learning_navigating
  name: Still Figuring It Out
  description:
    Undecided or still forming a view, actively navigating what AI means
    for them.
  parentId: ai_adoption_stance

# ------------------------------------------------------------------- #
#    Survey Format
# ------------------------------------------------------------------- #

- id: survey_format
  name: Survey Format
  description: "Suggestions about how the survey asks questions rather than what it asks about."

- id: more_positive_questions
  name: Positive Questions
  description: "Ask what people like or praise, not only pain points."
  parentId: survey_format

- id: finer_rating_scales
  name: Finer Rating Scales
  description: "Use numeric ratings or rankings instead of binary positive/negative sentiment."
  parentId: survey_format

- id: more_why_questions
  name: "\"Why\" Questions"
  description: "Ask why people chose (or didn't choose) a tool or framework."
  parentId: survey_format

- id: survey_ux_feedback
  name: Survey Form Feedback
  description: "Feedback on the survey form itself (bugs, translations, gamification, live results)."
  parentId: survey_format

- id: more_technical_questions
  name: More Technical Questions
  description: "Ask more about technology and development work, fewer personal questions."
  parentId: survey_format

# ------------------------------------------------------------------- #
#    AI
# ------------------------------------------------------------------- #

- id: ai_in_development
  name: AI in Development
  description: "Questions about AI in developers' work."

- id: ai_usage_tasks
  name: AI Use Cases
  description: "What do you use AI for (code generation, review, debugging, testing, docs…)?"
  parentId: ai_in_development

- id: ai_tools_used
  name: AI Tools Used
  description: "Which AI tools, assistants, or agents do you use?"
  parentId: ai_in_development

- id: ai_sentiment
  name: Feelings About AI
  description: "How do you feel about AI (hopes, fears, ethics)?"
  parentId: ai_in_development

- id: ai_code_quality
  name: AI Code Quality
  description: "How good is AI-generated code, and does AI save or waste time?"
  parentId: ai_in_development

- id: ai_job_security
  name: AI & Job Security
  description: "Will AI replace your job, and how is it affecting junior developers?"
  parentId: ai_in_development

- id: ai_workplace_pressure
  name: Pressure to Use AI
  description: "Is your company or are others pushing you to use AI?"
  parentId: ai_in_development

- id: ai_non_usage
  name: Reasons for Not Using AI
  description: "If you don't use AI, why not?"
  parentId: ai_in_development

- id: ai_skill_impact
  name: AI Impact on Skills
  description: "Is AI affecting your skills, thinking, and independence (deskilling, dependence, cognitive decline)?"
  parentId: ai_in_development

- id: programming_enjoyment
  name: Enjoyment of Programming
  description: "Do you enjoy writing code yourself (vs letting AI do it), and has that changed?"
  parentId: ai_in_development

- id: ai_company_adoption
  name: Company AI Adoption
  description: "How companies and management adopt AI (spending, policies, responsible use, coworkers vs executives)."
  parentId: ai_in_development

- id: ai_productivity
  name: AI Productivity
  description: "Does AI make you more productive or change your workload and output?"
  parentId: ai_in_development

- id: ai_job_satisfaction
  name: AI & Job Satisfaction
  description: "How AI affects enjoyment of the job and mental health at work."
  parentId: ai_in_development

- id: ai_predictions
  name: AI Predictions
  description: "Where will AI and AI adoption be in the coming years?"
  parentId: ai_in_development

- id: ai_societal_impact
  name: AI Societal Impact
  description: "AI's impact on society, culture, education, and privacy."
  parentId: ai_in_development

- id: ai_colleagues
  name: AI & Colleagues
  description: "How colleagues and teams use AI, and how their use affects you."
  parentId: ai_in_development

- id: ai_ethics_environment
  name: AI Ethics & Environment
  description: "Ethical and environmental concerns about AI (copyright, energy use, labor, morality of using it)."
  parentId: ai_in_development

- id: ai_opt_out
  name: Opting Out of AI
  description: "Can you avoid or disable AI; resisting AI adoption; would you remove AI if you could?"
  parentId: ai_in_development

- id: ai_learning_impact
  name: AI & Learning
  description: "AI's effect on learning, education, and junior developers."
  parentId: ai_in_development

- id: personal_ai_use
  name: Personal AI Use
  description: "Using AI outside work (personal life, health, therapy) and work vs personal use."
  parentId: ai_in_development

- id: ai_literacy
  name: AI Literacy
  description: "How well people understand how AI and LLMs work; AI training and certifications."
  parentId: ai_in_development

- id: ai_regulation
  name: AI Regulation
  description: "Should AI be regulated, by whom, and how?"
  parentId: ai_in_development

- id: ai_company_views
  name: Views on AI Companies
  description: "Opinions about AI companies and labs (trust, policies, power)."
  parentId: ai_in_development


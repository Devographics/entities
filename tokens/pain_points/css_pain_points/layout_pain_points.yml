- id: margin_issues
  patterns:
    - margin

- id: stacking_context
  idAliases:
    - stacking_context_issues
  name: |
    Stacking contexts & `z-index`
  descriptionIssues: Managing z-index, stacking contexts, and layering conflicts ("z-index hell"), including unexpected interactions with transforms, sticky, and the top layer.
  patterns:
    - z, index [l]
    - stack
    - stacking

- id: scrollbar_issues
  patterns:
    - scroll( |-)?bar
  tags:
    - interactions_pain_points

- id: scrolling_issues
  patterns:
    - scrolling
    - scroll
  tags:
    - interactions_pain_points

- id: absolute_positioning_issues
  patterns:
    - absolute

- id: box_model_issues
  patterns:
    - box, model [l]
    - box, sizing [l]

- id: table_layouts_issues
  patterns:
    - table

- id: sizing_issues
  name: Element sizing
  patterns:
    - sizing

- id: dynamic_sizing
  name: Dynamic sizing
  parentId: sizing_issues

- id: spacing_issues
  patterns:
    - spacing

- id: table_layout
  name: |
    Table Layout & Styling
  description: >
    Issues with styling tables, including responsiveness, sticky
    headers/columns, and layout control.
  parentId: tables

- id: extrinsic_sizing
  name: Extrinsic sizing
  descriptionIssues: >
    Sizing elements to fill available or viewport width or height: 100% height chains, full-height children without an explicit parent height, and stretching to fit remaining space.
  parentId: sizing_issues

- id: container_query_wrapper
  name: Container query wrapper requirement
  parentId: limitations
  descriptionIssues: >
    Container queries requiring an extra wrapper element because an element cannot query itself; desire for self/element conditionals.

- id: grid_track_sizing
  name: Grid track sizing
  parentId: grid
  descriptionIssues: >
    Sizing grid tracks with fr units, minmax(), and auto-fit/auto-fill repeat, including their behavior and where they can be used.

- id: css_sizing
  name: Sizing
  descriptionIssues: >
    Controlling how elements are sized — by their content (intrinsic), by their context or available space (extrinsic), or by explicit constraints — and the difficulty of reasoning about which applies.

- id: automatic_min_size
  name: Automatic minimum size
  parentId: sizing_issues
  descriptionIssues: >
    The automatic minimum size of flex and grid items causing overflow or squishing, often requiring the min-width: 0 / min-height: 0 workaround.

- id: positioning
  idAliases:
    - positioning_issues
  name: Positioning
  descriptionIssues: >
    The CSS position model in general: relative, absolute, and fixed positioning relationships, and positioning relative to the viewport.

- id: box_alignment
  name: Alignment properties
  parentId: alignment_issues
  descriptionIssues: >
    The align-*/justify-* and place-* properties, especially how their meaning flips with flex direction and writing mode.

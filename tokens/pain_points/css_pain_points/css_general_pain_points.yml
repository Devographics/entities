- id: generated_content_replaced_elements
  name: |
    ::before and ::after on replaced elements
  parentId: styling_customization

- id: css_values_units
  name: |
    CSS Values & Units
  description: |
    Pain points related to specific CSS values and units.
  parentId: styling_customization

- id: top_layer
  name: |
    Top Layer
  description: >
    Issues related to the top layer, where elements like <dialog> and popovers
    are rendered. Includes z-index conflicts, stacking order control, and
    interactions between multiple top-layer elements.
  parentId: styling_customization

- id: css_architecture
  name: CSS architecture & organization
  parentId: maintenance
  descriptionIssues: >
    Structuring, organizing, and architecting stylesheets at scale, and managing global vs local styles.

- id: css_naming_conventions
  name: CSS naming conventions
  parentId: css_architecture
  descriptionIssues: >
    Choosing and enforcing class/variable naming conventions and methodologies like BEM across teams and projects.

- id: css_cascade
  name: The cascade
  descriptionIssues: >
    Reasoning about, managing, and debugging the cascade: source order, inheritance, overrides, and layer/importance interactions.

- id: css_specificity
  name: Specificity
  parentId: cascade
  descriptionIssues: >
    Managing selector specificity and its interaction with overrides, !important, and :is()/:where()/:has() effects.

- id: unused_css
  name: Unused CSS
  parentId: maintenance
  descriptionIssues: >
    Difficulty identifying which rules, classes, or styles are unused/dead and safe to remove, leading to bloat and fear of deleting code.

- id: css_data_structures
  name: Data structures
  descriptionIssues: >
    Desire for native CSS data structures — maps/dictionaries, lists, arrays — to hold and look up sets of related values (theme maps, breakpoint sets), currently faked with preprocessors or repetitive custom properties.

- id: dynamic_var
  name: Dynamic var() references
  parentId: css_data_structures
  descriptionIssues: >
    Referencing a custom property whose name is composed dynamically (e.g. var(--color-<state>)) — indirection / computed variable names — to enable keyed lookups rather than only static var() references.

- id: css_frameworks_issues
  name: CSS frameworks
  parentId: ecosystem
  descriptionIssues: >
    Pain points about CSS frameworks and component libraries: their dominance, being forced to adopt them, abstraction over native CSS, and overriding their styles.

- id: preprocessors
  name: Preprocessors
  descriptionIssues: >
    Issues related to using preprocessors such as SASS, LESS, etc.

- id: list_reordering_animations
  name: |
    List Reordering Animations
  description: >
    Difficulties in creating performant and smooth animations when items in a
    list are added, removed, or reordered, often requiring complex techniques
    like FLIP (First, Last, Invert, Play).
  parentId: animations_issues

- id: scroll_markers
  name: |
    Scroll markers
  description: >
    Issues related to the ::scroll-marker and ::scroll-marker-group
    pseudo-elements.
  parentId: scroll-triggered_animations

- id: cross_document_view_transitions
  name: |
    Cross-document View Transitions
  parentId: view_transitions

- id: scroll-triggered_animations
  name: |
    Scroll-triggered Animations
  description: >
    Performance issues with animations that are linked to the user's scroll
    position.
  parentId: animations_issues

- id: entry_exit_animations
  name: Enter/exit animations
  parentId: animations_issues
  descriptionIssues: Difficulty animating elements as they enter or are removed from the DOM, and transitioning between hidden and visible states, often requiring @starting-style, allow-discrete, or JS.

- id: animation_sequencing
  name: Animation sequencing
  parentId: animations_issues
  descriptionIssues: >
    Coordinating, ordering, and timing multiple animations or transitions relative to each other, and reasoning about what happens when.

- id: animation_triggers
  name: Triggering animations
  parentId: animations_issues
  descriptionIssues: >
    Firing, re-firing, pausing, or preventing animations and transitions, including one-off triggers that today require JS to remove and re-add classes.

- id: non_animatable_properties
  name: Non-animatable properties
  parentId: animations_issues
  descriptionIssues: >
    Frustration that certain properties, keywords, or sizes (e.g. gradients, sizing keywords) cannot be animated or transitioned.

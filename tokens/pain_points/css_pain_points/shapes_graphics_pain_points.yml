- id: svg_issues
  patterns:
    - svg
  tags:
    - testing_pain_points

- id: gradient_issues
  patterns:
    - gradient

- id: shape_issues
  patterns:
    - shape

- id: path_syntax
  name: Path syntax
  parentId: svg_technology
  descriptionIssues: >
    The verbosity and unreadability of path() and SVG d syntax, which is hard to author or edit by hand.

- id: svg_embedding_modes
  name: SVG embedding modes
  parentId: svg_technology
  descriptionIssues: >
    Differences and adjustments needed depending on how SVG is embedded (inline, <img>, <use> sprites, url()), affecting styling, sizing, and behavior.
  tags:
    - other_features_pain_points

- id: css_icons
  name: Icons
  descriptionIssues: >
    Working with icons in CSS: choosing between icon fonts, inline SVG, and mask/background approaches; sizing and aligning icons with text; recoloring via currentColor; multi-color or interactive icons; and adapting icons via CSS (media queries, selectors, and state) rather than swapping assets.

- id: advanced_borders
  name: Advanced borders
  parentId: css_border
  descriptionIssues: >
    Decorative border effects: multiple/stacked or offset borders, custom dash spacing, gradient borders, and corner-only decoration.
  tags:
    - layout_pain_points

- id: css_textures
  name: Textures
  parentId: filter_effects
  descriptionIssues: >
    Native support for generating textures and surface detail — noise, grain, turbulence, and procedural patterns — without images or SVG filters.

- id: responsive_shapes
  name: Responsive shapes
  parentId: shapes
  descriptionIssues: >
    Shapes, clip-paths, and SVGs breaking, skewing, or cropping when elements scale or change aspect ratio across viewport sizes.

- id: box_model_issues
  name: Box model & box-sizing
  descriptionIssues: >
    Confusion around the box model: box-sizing defaults, collapsing margins, and how border/padding interact with declared sizes.
  tags:
    - css_general_pain_points

- id: css_in_svg
  name: CSS inside SVG
  descriptionIssues: >
    Modern CSS primitives not working, or behaving inconsistently, inside SVG — e.g. custom properties and functions, shape(), or color functions unavailable in SVG geometry/presentation contexts (such as shape() in <path>).
  tags:
    - css_general_pain_points

- id: svg_css_properties
  name: SVG attributes as CSS properties
  parentId: css_in_svg
  descriptionIssues: >
    SVG geometry and presentation attributes (path d, viewBox, cx/cy/r, points, etc.) not being fully exposed as settable or animatable CSS properties.

- id: icons
  name: Icons issues
  descriptionIssues: >
    Issues related to using icons.
  tags:
    - layout_pain_points

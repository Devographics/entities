#################################################
# CSS shapes & graphics
#################################################

- id: shapes
  webFeaturesId: shapes
  name: Shapes
  description: >
    `shape-image-threshold`, `shape-margin`, `shape-outside`
  mdn: /en-US/docs/Web/CSS/CSS_Shapes
  caniuse: css-shapes
  example:
    language: css
    code: |
      img {
        float: left;
        shape-outside: circle(50%);
      }

- id: shape_inside
  name: "`shape-inside`"
  parentId: shapes
  descriptionIssues: >
    Desire for shape-inside to flow an element's content within a custom-shaped container, complementing shape-outside.

- id: object_fit
  webFeaturesId: object-fit
  name: "`object-fit`"
  mdn: /en-US/docs/Web/CSS/object-fit
  caniuse: object-fit
  example:
    language: css
    code: |
      .contain {
        object-fit: contain;
      }

- id: clip_path
  webFeaturesId: clip-path
  name: "`clip-path`"
  mdn: /en-US/docs/Web/CSS/clip-path
  caniuse: css-clip-path

- id: masks
  webFeaturesId: masks
  name: Masking
  mdn: /en-US/docs/Web/CSS/CSS_Masking
  caniuse: css-masks

- id: blend_modes
  webFeaturesId: mix-blend-mode
  description: >
    `mix-blend-mode`, `background-blend-mode`, `isolation`
  mdn: /en-US/docs/Web/CSS/blend-mode
  caniuse: css-mixblendmode
  example:
    language: css
    code: |
      .item2 {
        color: #000;
        mix-blend-mode: overlay;
      }

- id: filter_effects
  name: Filters & Effects
  description: >
    `blur()`, `brightness()`, `contrast()`…
  mdn: /en-US/docs/Web/CSS/filter
  caniuse: css-filters
  example:
    language: css
    code: |
      .image{
        filter: contrast(175%) blur(5px)
      }

- id: filter_effects_blur
  name: "`blur()` filter"
  mdn: /en-US/docs/Web/CSS/filter-function/blur
  caniuse: css-filters
  example:
    language: css
    code: |
      .image{
        filter: blur(5px)
      }
  patterns:
    - blur()
    - blur [e]

- id: backdrop_filter
  webFeaturesId: backdrop-filter
  name: "`backdrop-filter`"
  mdn: /en-US/docs/Web/CSS/backdrop-filter
  caniuse: css-backdrop-filter
  example:
    language: css
    code: |
      .box {
        backdrop-filter: blur(10px);
      }

- id: intrinsic_sizing
  parentId: sizing_issues
  webFeaturesId: min-max-content
  name: Intrinsic Sizing
  description: >
    `min-content`, `max-content`, `fit-content`
  mdn: /en-US/docs/Web/CSS/min-content
  caniuse: intrinsic-width
  example:
    language: css
    code: |
      h2 {
        width: max-content;
      }
  patterns:
    - fit-content
    - min-content
    - max-content

- id: repeating_linear_gradient
  parentId: css_gradients
  name: "`repeating-linear-gradient()`"
  mdn: /en-US/docs/Web/CSS/gradient/repeating-linear-gradient()
  caniuse: mdn-css_types_image_gradient_repeating-linear-gradient

- id: conic_gradient
  parentId: css_gradients
  webFeaturesId: conic-gradients
  name: "`conic-gradient()`"
  mdn: /en-US/docs/Web/CSS/gradient/conic-gradient()
  caniuse: mdn-css_types_image_gradient_conic-gradient
  example:
    language: css
    code: |
      .blue-to-red {
        background: conic-gradient(from 45deg, blue, red);
      }

- id: border_image
  webFeaturesId: border_image
  name: "`border-image`"
  mdn: /en-US/docs/Web/CSS/border-image
  caniuse: border-image

- id: linear_easing_function
  webFeaturesId: linear-easing
  name: >
    `linear` Easing Function
  mdn: en-US/docs/Web/CSS/easing-function#linear_easing_function
  caniuse: mdn-css_types_easing-function_linear-function
  example:
    language: css
    code: |
      :root {
        --bounce-easing: linear(
          0, 0.063, 0.25 18.2%, 1 36.4%, 0.813, 0.75, 0.813, 1, 0.938, 1, 1
        );
      }
  resources:
    - title: Using linear() for better animation
      url: https://fullystacked.net/posts/linear/
      language: en-US
    - title: Linear() Generator
      url: https://linear-easing-generator.netlify.app/
      language: en-US
  patterns:
    - linear [e]

- id: background_attachment
  name: >
    `background-attachment`
  mdn: en-US/docs/Web/CSS/background-attachment
  example:
    language: css
    code: |
      background-attachment: scroll;
      background-attachment: fixed;
      background-attachment: local;

- id: offset_path
  webFeaturesId: motion-path
  name: >
    `offset-path`
  mdn: en-US/docs/Web/CSS/offset-path
  caniuse: css-motion-paths
  example:
    language: css
    code: |
      .blueBox {
        background-color: blue;
        offset-path: border-box;
        offset-distance: 5%;
      }

- id: css_shape_function
  name: "`shape()`"
  mdn: en-US/docs/Web/CSS/basic-shape/shape
  caniuse: mdn-css_types_basic-shape_shape
  resources:
    - url: https://css-tricks.com/css-shape-commands/
      title: CSS shape() Commands
  example:
    language: css
    code: |
      .clipped {
        clip-path: shape(
          from top left,
          hline to 100%,
          vline to 100%,
          curve to 0% 100% with 50% 0%,
        );
      }
  patterns:
    - shape [e]
    - "shape()"

- id: css_gap_decorations
  webFeaturesId: gap-decorations
  name: Gap decorations
  resources:
    - url: https://blogs.windows.com/msedgedev/2025/03/19/minding-the-gaps-a-new-way-to-draw-separators-in-css/
      title: |
        Minding the gaps: A new way to draw separators in CSS
    - url: https://drafts.csswg.org/css-gaps-1/
      title: CSS Gaps Module Level 1
    - url: https://developer.chrome.com/blog/gap-decorations
      title: A new way to style gaps in CSS
  example:
    language: css
    code: |
      .alternate-red-blue {
        display: grid;
        grid-template: repeat(auto-fill, 30px) / repeat(6, 100px);
        gap: 10px;
        row-rule: 1px solid;
        row-rule-color: red blue;
      }

- id: css_corner_shape
  parentId: irregular_element_shape
  webFeaturesId: corner-shape
  name: |
    `corner-shape`
  mdn: en-US/docs/Web/CSS/Reference/Properties/corner-shape
  resources:
    - url: https://frontendmasters.com/blog/understanding-css-corner-shape-and-the-power-of-the-superellipse/
      title: Understanding CSS corner-shape and the Power of the Superellipse
    - url: https://drafts.csswg.org/css-borders-4/#corner-shaping
      title: |
        Corner Shaping: the corner-*-shape properties
  example:
    language: css
    code: |
      .rhombus {
        aspect-ratio: 2 / 3;
        border-radius: 50%;
        corner-shape: bevel;
      }
  patterns:
    - corner( |-)?shape

- id: css_border_shape
  parentId: irregular_element_shape
  webFeaturesId: border-shape
  name: |
    `border-shape`
  resources:
    - url: https://una.im/border-shape
      title: |
        border-shape: the future of the non-rectangular web
  example:
    language: css
    code: |
      border-shape: shape(
        from top left,                            
        hline to calc(100% - var(--arrow-size)), 
        line to right center,                           
        line to calc(100% - var(--arrow-size)) bottom,
        hline to left,      
        close                                      
      );
  patterns:
    - border( |-)?shape

- id: css_in_svg
  name: CSS inside SVG
  descriptionIssues: >
    Modern CSS primitives not working, or behaving inconsistently, inside SVG — e.g. custom properties and functions, shape(), or color functions unavailable in SVG geometry/presentation contexts (such as shape() in <path>).

- id: svg_css_properties
  name: SVG attributes as CSS properties
  parentId: css_in_svg
  descriptionIssues: >
    SVG geometry and presentation attributes (path d, viewBox, cx/cy/r, points, etc.) not being fully exposed as settable or animatable CSS properties.
